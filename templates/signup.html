<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <style>
        .navbar-brand:focus {
          outline: none;
        }

        .custom-grid-item {
            height: 20vh;
        }

        .grid-scroll-container {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px; 
        }

        #content-holder {
            background-color: gray;

        }
    </style>
  </head> 

  <body class="d-flex flex-column min-vh-100 m-0 bg-light">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark w-100">
          <div class="container-fluid">
            <a class="navbar-brand" href="/">ShopSmart</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link active" href="/products">Products</a>
                <a class="nav-link" href="/about">About us</a>
                <a class="nav-link" href="/support">Support</a>
            </div>
          </div>
      </nav>
      
      <div class="d-flex align-items-center justify-content-center flex-column w-100 flex-grow-1" id="content-holder">  <!-- flex grow 1 forces this thing to fill in the gaps -->
        <div class="bg-light p-4" style="width:fit-content;">
            <form id="signup" style="width:50vw;" class="m-4" method="post">
                <div>
                    <p class="fs-4" style="font-weight:600;">Hello, new user!</p>
                </div>
                <div class="form-group my-3">
                    <label for="email">Email address: </label>
                    <input type="email" class="form-control" id="email" placeholder="Email" name="email" required>
                </div>

                <div class="form-group my-3">
                    <label for="username">Username: </label>
                    <input type="text" class="form-control" id="username" placeholder="Username" name="username" required>
                </div>

                <div class="form-group my-3">
                    <label for="password">Password: </label>
                    <input type="password" class="form-control" id="password" placeholder="Password" name="password" required>
                </div>

                <input class="btn btn-primary btn-sm" value="Sign up to ShopSmart" type="submit"> <!--add a thingy to return prompt to the user later-->

            </form>
        </div>
          
      </div>
  </body>
</html>
