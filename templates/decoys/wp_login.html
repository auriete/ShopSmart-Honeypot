{# Decoy page (see main.py): fake WordPress login, always shows an error. #}
<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <title>Log In &lsaquo; ShopSmart &#8212; WordPress</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f1; }
    .box { width: 300px; margin: 80px auto; background: #fff; padding: 26px; border: 1px solid #c3c4c7; }
    h1 { text-align: center; font-size: 24px; color: #3c434a; margin-top: 0; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input[type=text], input[type=password] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; background: #2271b1; color: #fff; border: 0; border-radius: 3px; float: right; }
    .error { border-left: 4px solid #d63638; background: #fff; padding: 10px; margin-bottom: 16px; font-size: 13px; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
    form::after { content: ""; display: block; clear: both; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ShopSmart</h1>
    {% if error %}<div class="error"><strong>Error:</strong> {{ error }}</div>{% endif %}
    <form method="post" action="/wp-login.php">
      <label for="user_login">Username or Email Address</label>
      <input type="text" name="log" id="user_login">
      <label for="user_pass">Password</label>
      <input type="password" name="pwd" id="user_pass">
      <input type="hidden" name="redirect_to" value="/wp-admin/">
      <input type="hidden" name="testcookie" value="1">
      <button type="submit" name="wp-submit">Log In</button>
    </form>
  </div>
</body>
</html>
